services:
  vaultwarden:
    image: vaultwarden/server:1.37.3
    user: "102:105"
    restart: unless-stopped

    environment:
      SIGNUPS_ALLOWED: "false"
      DOMAIN: "https://${VAULT_DOMAIN:?VAULT_DOMAIN is not set}"

    volumes:
      - /srv/vaultwarden/data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    environment:
      VAULT_DOMAIN: "${VAULT_DOMAIN:?VAULT_DOMAIN is not set}"
      
    ports:
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      - vaultwarden

volumes:
  caddy_data:
  caddy_config:
